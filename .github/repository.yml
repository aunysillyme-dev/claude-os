      files:
        - 01_stack_overview.md
        - 02_tool_to_task_mapping.md
    
    templates:
      path: templates/
      description: Vault skeleton and workflow templates ready to use
      subdirs:
        - vault-skeleton/
        - persona-examples/
        - workflow-templates/
    
    integrations:
      path: integrations/
      description: MCP setup guides and tool integration documentation
      files:
        - 01_grok-mcp-setup.md
        - 02_linear-mcp-setup.md
        - 03_remotion-mcp-setup.md

