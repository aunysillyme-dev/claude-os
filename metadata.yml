# Key Concepts
concepts:
  session_protocol:
    description: 6-step routing system that loads context before every session
    steps:
      1. IDENTIFY - What domain is this?
      2. READ - Load relevant files from vault
      3. CHECK - Pull relevant project tasks
      4. WORK - Execute with full context
      5. UPDATE - Mark completed tasks immediately
      6. SAVE - Write new context to vault
  
  vault_as_brain:
    description: Obsidian vault connected to Claude via MCP as single source of truth
    contains:
      - Cognitive and psychological profile
      - Content manual and voice calibration
      - Domain routing protocols
      - Active projects and task tracker
      - Analytics patterns (updated every session)
      - Tool integration configs
  
  multi_ai_orchestration:
    description: Right tool for right job, no tool overburdened
    principle: Claude (chief of staff), Gemini (research), Grok (real-time), ChatGPT (alternatives)
  
  persona_architecture:
    description: Named persona with job description and reading list
    includes:
      - Clear operational role
      - Behavioral rules
      - Required reading before each session

